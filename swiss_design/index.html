<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiss Design con SVG + viewBox</title>
  <style>
    html,
    body {
      /* height: 100%;
      margin: 0;
      padding: 0; */
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      height: 100%;
      scroll-behavior: smooth;
    }

    section {
      height: 100vh;
      scroll-snap-align: start;
    }

    .pantalla {
  height: 100vh;
  scroll-snap-align: start;
  display: flex;              /* centra contenido */
  justify-content: center;
  align-items: center;
  flex-direction: column;     /* apila elementos verticalmente */
  padding: 2rem;
}

.proyectos .grid {
  display: grid;
  grid-template-columns: 1fr 1fr; /* dos columnas */
  gap: 2rem;
}

    .hero-title {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      background-color: white;
      overflow: hidden;
    }

    .hero-title svg {
      max-width: 100vw;
      /* ocupa hasta 90% del ancho */
      max-height: 100vh;
      /* ocupa hasta 90% de la altura */
      object-fit: contain;
      /* mantiene proporción */
      display: block;
      position: relative;
      z-index: 50;
      /* menor que el navbar */
    }





    /* Línea superior fija */
    #Vector\ 1 {
      opacity: 1;
      transform: none;
      animation: none;
    }

    /* Animación general */
    path:not(#Vector\ 1) {
      opacity: 0;
      transform: translateY(100px);
      animation: escanearDescendente 1.5s ease-out forwards;
      animation-play-state: paused;
      /* empieza pausada */
    }

    @keyframes escanearDescendente {
      0% {
        opacity: 0;
        transform: translateY(280px);
        clip-path: inset(0 0 100% 0);
      }

      /* 50% {
        opacity: 1;
      } */
      100% {
        opacity: 1;
        transform: translateY(0);
        clip-path: inset(0 0 0 0);
      }
    }

    /* navbar */


    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: white;
      border-bottom: 1px solid black;
      display: flex;
      /* clave: activa flexbox */
      justify-content: center;
      /* centra horizontalmente */
      gap: 3rem;
      /* espacio entre enlaces */
      padding: 2rem 0;
      /* antes 1rem 0 */
      z-index: 200;
    }

    .navbar a {
      text-decoration: none;
      color: black;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 1.1rem;
      font-weight: bold;
      transition: color 0.3s ease;
    }


    .navbar a:hover {
      color: gray;
      /* efecto hover sutil */
    }

    .navbar ul {
      list-style: none;
      display: flex;
      /* activa flexbox en la lista */
      gap: 3rem;
      /* espacio entre enlaces */
      margin: 0;
      padding: 0;
    }

    .navbar li {
      display: inline;
      /* cada item en línea */
    }
  </style>
</head>
